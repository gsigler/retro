services:
  db:
    image: postgres:16-alpine
    container_name: retro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: retro
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: deps
    working_dir: /app
    command: >
      sh -c "npx -w @retro/api prisma generate &&
             npx -w @retro/api prisma migrate deploy &&
             npx -w @retro/api nest start --watch --preserveWatchOutput"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      - ./apps/api/prisma.config.ts:/app/apps/api/prisma.config.ts
      - ./apps/api/nest-cli.json:/app/apps/api/nest-cli.json
      - ./apps/api/tsconfig.json:/app/apps/api/tsconfig.json
      - ./apps/api/tsconfig.build.json:/app/apps/api/tsconfig.build.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/retro?schema=public
      PORT: '${API_PORT:-3000}'
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: deps
    working_dir: /app
    command: npx -w @retro/web vite --host 0.0.0.0 --clearScreen false
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/tsconfig.app.json:/app/apps/web/tsconfig.app.json
      - ./apps/web/tsconfig.node.json:/app/apps/web/tsconfig.node.json
      - ./tsconfig.base.json:/app/tsconfig.base.json
    ports:
      - '${WEB_PORT:-5173}:${WEB_PORT:-5173}'
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-3000}/api

volumes:
  pgdata:
